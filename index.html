<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotación de Horarios - Equipo</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --home-office: #d0e1fd;
            --presencial: #fcd5ce;
            --home-office-text: #1b4f72;
            --presencial-text: #922b21;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dee2e6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .week-banner {
            background: #eaf2f8;
            border-left: 5px solid var(--secondary-color);
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            text-align: left;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: space-between;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 220px;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #555;
        }

        select,
        input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus,
        input:focus {
            border-color: var(--secondary-color);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-bottom: 15px;
        }

        th,
        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            background-color: #f1f3f5;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* Estilos de turnos */
        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.85rem;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .home-office {
            background-color: var(--home-office);
            color: var(--home-office-text);
        }

        .presencial {
            background-color: var(--presencial);
            color: var(--presencial-text);
        }

        .today-col {
            background-color: rgba(52, 152, 219, 0.05);
            border-left: 2px dashed var(--secondary-color);
            border-right: 2px dashed var(--secondary-color);
        }

        tfoot td {
            font-weight: bold;
            background-color: #f8f9fa;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            th,
            td {
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>📅 Horarios Rotativos del Equipo</h1>
            <p>Visualiza los turnos presenciales y de home office de la semana</p>
        </header>

        <div id="weekBanner" class="week-banner">
            Calculando semana actual...
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="weekSelect">Seleccionar Semana:</label>
                <select id="weekSelect" onchange="updateView()">
                    <option value="1">Semana 1</option>
                    <option value="2">Semana 2</option>
                    <option value="3">Semana 3</option>
                    <option value="4">Semana 4</option>
                </select>
            </div>

            <div class="control-group">
                <label for="nameFilter">Filtrar por Colaborador:</label>
                <select id="nameFilter" onchange="updateView()">
                    <option value="">Todos los colaboradores</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table id="scheduleTable">
                <thead>
                    <tr id="tableHeaderRow">
                        <th>Colaborador</th>
                        <th id="th-1">Lunes</th>
                        <th id="th-2">Martes</th>
                        <th id="th-3">Miércoles</th>
                        <th id="th-4">Jueves</th>
                        <th id="th-5">Viernes</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Los datos se inyectarán mediante JavaScript -->
                </tbody>
                <tfoot>
                    <tr id="tableFooter">
                        <td>Total Presencial</td>
                        <td id="tot-1">-</td>
                        <td id="tot-2">-</td>
                        <td id="tot-3">-</td>
                        <td id="tot-4">-</td>
                        <td id="tot-5">-</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <footer>
            Actualizado automáticamente para GitHub Pages • Sistema de Horarios Internos
        </footer>
    </div>

    <script>
        // Datos de los horarios extraídos de la planificación del equipo
        const schedules = {
            1: [
                {name: "Daniel Jimenez", days: ["Home Office", "Home Office", "Presencial", "Home Office", "Presencial"]},
                {name: "Diego", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Presencial"]},
                {name: "Carlos", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Home Office"]},
                {name: "Williams", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Home Office"]},
                {name: "Joshua", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Presencial"]},
                {name: "Julio", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"]},
                {name: "Pablo", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"]},
                {name: "Ramiro", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"]},
                {name: "Josue", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"]},
                {name: "Chan", days: ["Presencial", "Presencial", "Presencial", "Presencial", "Home Office"]},
                {name: "Alex", days: ["Presencial", "Home Office", "Presencial", "Presencial", "Home Office"]}
            ],
            2: [
                {name: "Daniel Jimenez", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"]},
                {name: "Diego", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Presencial"]},
                {name: "Carlos", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Home Office"]},
                {name: "Williams", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Home Office"]},
                {name: "Joshua", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Presencial"]},
                {name: "Julio", days: ["Home Office", "Home Office", "Presencial", "Home Office", "Presencial"]},
                {name: "Pablo", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"]},
                {name: "Ramiro", days: ["Presencial", "Presencial", "Presencial", "Presencial", "Home Office"]},
                {name: "Josue", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"]},
                {name: "Chan", days: ["Presencial", "Home Office", "Presencial", "Presencial", "Home Office"]},
                {name: "Alex", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"]}
            ],
            3: [
                {name: "Daniel Jimenez", days: ["Presencial", "Home Office", "Presencial", "Home Office", "Home Office"]},
                {name: "Diego", days: ["Presencial", "Presencial", "Presencial", "Presencial", "Presencial"]},
                {name: "Carlos", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Presencial"]},
                {name: "Williams", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"]},
                {name: "Joshua", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Home Office"]},
                {name: "Julio", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"]},
                {name: "Pablo", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"]},
                {name: "Ramiro", days: ["Home Office", "Home Office", "Presencial", "Home Office", "Presencial"]},
                {name: "Josue", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"]},
                {name: "Chan", days: ["Presencial", "Home Office", "Presencial", "Presencial", "Presencial"]},
                {name: "Alex", days: ["Home Office", "Home Office", "Presencial", "Home Office", "Presencial"]}
            ],
            4: [
                {name: "Daniel Jimenez", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"]},
                {name: "Diego", days: ["Presencial", "Home Office", "Presencial", "Home Office", "Home Office"]},
                {name: "Carlos", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"]},
                {name: "Williams", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Presencial"]},
                {name: "Joshua", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Presencial"]},
                {name: "Julio", days: ["Presencial", "Home Office", "Presencial", "Home Office", "Home Office"]},
                {name: "Pablo", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"]},
                {name: "Ramiro", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Presencial"]},
                {name: "Josue", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Home Office"]},
                {name: "Chan", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"]},
                {name: "Alex", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"]}
            ]
        };

        // Lógica para calcular la semana actual automáticamente basada en una fecha de anclaje
        function calculateCurrentWeek() {
            // Fecha ancla conocida: Supongamos que hoy (octubre de 2026) estamos en la Semana 3.
            // Usaremos una fecha base de referencia para calcular las diferencias de semanas de forma cíclica (1 al 4).
            const baseDate = new Date(2026, 9, 5); // Un lunes de referencia en Semana 3
            const today = new Date();

            // Diferencia en semanas enteras
            const diffTime = today - baseDate;
            const diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));

            // Calcular semana cíclica (1, 2, 3, 4) sabiendo que la base es Semana 3
            let currentWeek = ((3 + diffWeeks - 1) % 4) + 1;
            if (currentWeek <= 0) currentWeek += 4;

            // Calcular qué semana tocará el próximo lunes
            let nextWeek = (currentWeek % 4) + 1;

            return {currentWeek, nextWeek};
        }

        function init() {
            // Poblar el selector de nombres con los colaboradores ordenados alfabéticamente
            const nameFilter = document.getElementById('nameFilter');
            const uniqueNames = schedules[1].map(item => item.name).sort();

            uniqueNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                nameFilter.appendChild(option);
            });

            // Establecer la semana actual calculada automáticamente
            const {currentWeek, nextWeek} = calculateCurrentWeek();
            document.getElementById('weekSelect').value = currentWeek;

            // Mostrar banner informativo
            const banner = document.getElementById('weekBanner');
            banner.innerHTML = `📍 Actualmente te encuentras en la <strong>Semana ${currentWeek}</strong>. El próximo lunes el sistema cambiará automáticamente a la <strong>Semana ${nextWeek}</strong>.`;

            highlightTodayColumn();
            updateView();
        }

        function highlightTodayColumn() {
            const jsDay = new Date().getDay(); // 1 = Lunes, ..., 5 = Viernes
            if (jsDay >= 1 && jsDay <= 5) {
                document.getElementById(`th-${jsDay}`).classList.add('today-col');
            }
        }

        function updateView() {
            const selectedWeek = document.getElementById('weekSelect').value;
            const selectedName = document.getElementById('nameFilter').value;
            const tbody = document.getElementById('tableBody');

            tbody.innerHTML = '';

            let data = schedules[selectedWeek];

            // Filtrar por nombre si se seleccionó uno
            if (selectedName) {
                data = data.filter(item => item.name === selectedName);
            }

            // Totales presenciales por día
            let totals = [0, 0, 0, 0, 0];

            data.forEach(person => {
                const tr = document.createElement('tr');

                let html = `<td><strong>${person.name}</strong></td>`;

                person.days.forEach((dayType, index) => {
                    const cssClass = dayType === 'Home Office' ? 'home-office' : 'presencial';
                    const jsDay = new Date().getDay();
                    const isToday = (index + 1) === jsDay ? 'today-col' : '';

                    html += `<td class="${isToday}"><span class="badge ${cssClass}">${dayType}</span></td>`;

                    if (dayType === 'Presencial') {
                        totals[index]++;
                    }
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });

            // Actualizar fila de totales
            for (let i = 0; i < 5; i++) {
                document.getElementById(`tot-${i + 1}`).textContent = totals[i];
            }
        }

        window.onload = init;
    </script>
</body>

</html>
