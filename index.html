<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Horarios Rotativos</title>
    <style>
        :root {
            /* Paleta Darkmode basada en la plataforma */
            --bg-color: #111625;
            --sidebar-bg: #1a2238;
            --card-bg: #1e2942;
            --card-border: #2e3c5d;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
            --accent-yellow: #f5a623;
            --accent-yellow-hover: #e09212;

            /* Colores de Badges para Dark Mode */
            --home-office-bg: #1e3a5f;
            --home-office-text: #60a5fa;
            --home-office-border: #2563eb;

            --presencial-bg: #4a1d33;
            --presencial-text: #f472b6;
            --presencial-border: #db2777;

            --today-highlight: rgba(245, 166, 35, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            flex-wrap: wrap;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Espacio para subir logo.png al repo */
        .logo-img {
            max-height: 48px;
            width: auto;
            object-fit: contain;
        }

        .title-group h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .title-group p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .week-banner {
            background: rgba(245, 166, 35, 0.08);
            border: 1px solid rgba(245, 166, 35, 0.25);
            border-left: 4px solid var(--accent-yellow);
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.92rem;
            color: #ffead0;
            line-height: 1.5;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        select,
        input {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus,
        input:focus {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: var(--sidebar-bg);
        }

        th,
        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.9rem;
        }

        th {
            background-color: #151d30;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            text-align: center;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        .day-title {
            display: block;
            font-weight: 700;
            color: var(--text-main);
        }

        .date-subtitle {
            display: block;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 3px;
            font-weight: normal;
            text-transform: lowercase;
        }

        /* Estilos de turnos */
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid transparent;
        }

        .home-office {
            background-color: var(--home-office-bg);
            color: var(--home-office-text);
            border-color: var(--home-office-border);
        }

        .presencial {
            background-color: var(--presencial-bg);
            color: var(--presencial-text);
            border-color: var(--presencial-border);
        }

        .today-col {
            background-color: var(--today-highlight) !important;
        }

        th.today-col .day-title {
            color: var(--accent-yellow);
        }

        th.today-col {
            border-bottom: 2px solid var(--accent-yellow);
        }

        tfoot td {
            font-weight: 700;
            background-color: #141b2d;
            color: var(--accent-yellow);
            text-align: center;
        }

        tfoot td:first-child {
            text-align: left;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .container {
                padding: 18px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div class="brand-section">
                <!-- Sube tu logo como logo.png en la raíz del repo -->
                <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="title-group">
                    <h1>Horarios Rotativos</h1>
                    <p>Módulo de Consulta de Turnos Semanales</p>
                </div>
            </div>
        </header>

        <div id="weekBanner" class="week-banner">
            Calculando semana en curso...
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="weekSelect">Semana de Consulta</label>
                <select id="weekSelect" onchange="onWeekChange()">
                    <option value="1">Semana 1</option>
                    <option value="2">Semana 2</option>
                    <option value="3">Semana 3</option>
                    <option value="4">Semana 4</option>
                </select>
            </div>

            <div class="control-group">
                <label for="nameFilter">Buscar Colaborador</label>
                <select id="nameFilter" onchange="updateView()">
                    <option value="">Todos los colaboradores</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table id="scheduleTable">
                <thead>
                    <tr id="tableHeaderRow">
                        <th>Colaborador</th>
                        <th id="th-1"><span class="day-title">Lunes</span><span class="date-subtitle"
                                id="date-1">--</span></th>
                        <th id="th-2"><span class="day-title">Martes</span><span class="date-subtitle"
                                id="date-2">--</span></th>
                        <th id="th-3"><span class="day-title">Miércoles</span><span class="date-subtitle"
                                id="date-3">--</span></th>
                        <th id="th-4"><span class="day-title">Jueves</span><span class="date-subtitle"
                                id="date-4">--</span></th>
                        <th id="th-5"><span class="day-title">Viernes</span><span class="date-subtitle"
                                id="date-5">--</span></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Filas inyectadas dinámicamente -->
                </tbody>
                <tfoot>
                    <tr id="tableFooter">
                        <td>Total Presencial</td>
                        <td id="tot-1">-</td>
                        <td id="tot-2">-</td>
                        <td id="tot-3">-</td>
                        <td id="tot-4">-</td>
                        <td id="tot-5">-</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <footer>
            Sistema Interno • Control de Turnos en GitHub Pages
        </footer>
    </div>

    <script>
        // Mapeo corregido desde la hoja 'HorariosFinales'
        const schedules = {
            "1": [
                { name: "Daniel Jimenez", days: ["Home Office", "Home Office", "Presencial", "Home Office", "Presencial"] },
                { name: "Diego", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Presencial"] },
                { name: "Carlos", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Home Office"] },
                { name: "Williams", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Home Office"] },
                { name: "Joshua", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Presencial"] },
                { name: "Julio", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"] },
                { name: "Pablo", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"] },
                { name: "Ramiro", days: ["Presencial", "Home Office", "Presencial", "Home Office", "Home Office"] },
                { name: "Josue", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"] },
                { name: "Chan", days: ["Presencial", "Presencial", "Presencial", "Presencial", "Home Office"] },
                { name: "Alex", days: ["Presencial", "Home Office", "Presencial", "Home Office", "Home Office"] }
            ],
            "2": [
                { name: "Daniel Jimenez", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"] },
                { name: "Diego", days: ["Home Office", "Home Office", "Presencial", "Home Office", "Presencial"] },
                { name: "Carlos", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Home Office"] },
                { name: "Williams", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Home Office"] },
                { name: "Joshua", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Presencial"] },
                { name: "Julio", days: ["Home Office", "Home Office", "Presencial", "Home Office", "Presencial"] },
                { name: "Pablo", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"] },
                { name: "Ramiro", days: ["Presencial", "Presencial", "Presencial", "Presencial", "Home Office"] },
                { name: "Josue", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Home Office"] },
                { name: "Chan", days: ["Presencial", "Home Office", "Presencial", "Presencial", "Home Office"] },
                { name: "Alex", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"] }
            ],
            "3": [
                { name: "Daniel Jimenez", days: ["Presencial", "Home Office", "Presencial", "Home Office", "Home Office"] },
                { name: "Diego", days: ["Presencial", "Presencial", "Presencial", "Presencial", "Home Office"] },
                { name: "Carlos", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Home Office"] },
                { name: "Williams", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Home Office"] },
                { name: "Joshua", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Presencial"] },
                { name: "Julio", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"] },
                { name: "Pablo", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"] },
                { name: "Ramiro", days: ["Home Office", "Home Office", "Presencial", "Home Office", "Presencial"] },
                { name: "Josue", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"] },
                { name: "Chan", days: ["Presencial", "Home Office", "Presencial", "Presencial", "Presencial"] },
                { name: "Alex", days: ["Home Office", "Home Office", "Presencial", "Home Office", "Presencial"] }
            ],
            "4": [
                { name: "Daniel Jimenez", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"] },
                { name: "Diego", days: ["Presencial", "Home Office", "Presencial", "Home Office", "Home Office"] },
                { name: "Carlos", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Home Office"] },
                { name: "Williams", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Home Office"] },
                { name: "Joshua", days: ["Home Office", "Presencial", "Presencial", "Home Office", "Presencial"] },
                { name: "Julio", days: ["Presencial", "Home Office", "Presencial", "Home Office", "Home Office"] },
                { name: "Pablo", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"] },
                { name: "Ramiro", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Presencial"] },
                { name: "Josue", days: ["Home Office", "Presencial", "Presencial", "Presencial", "Home Office"] },
                { name: "Chan", days: ["Presencial", "Presencial", "Presencial", "Home Office", "Home Office"] },
                { name: "Alex", days: ["Home Office", "Home Office", "Presencial", "Presencial", "Presencial"] }
            ]
        };

        const anchorDate = new Date(2026, 9, 26);
        const anchorWeek = 3;

        function getMondayOfCurrentRealWeek() {
            const now = new Date();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(now.setDate(diff));
            monday.setHours(0, 0, 0, 0);
            return monday;
        }

        function calculateCurrentWeek() {
            const currentMonday = getMondayOfCurrentRealWeek();
            const diffTime = currentMonday - anchorDate;
            const diffWeeks = Math.round(diffTime / (1000 * 60 * 60 * 24 * 7));

            let currentWeek = ((anchorWeek + diffWeeks - 1) % 4) + 1;
            if (currentWeek <= 0) currentWeek += 4;

            let nextWeek = (currentWeek % 4) + 1;
            return { currentWeek, nextWeek };
        }

        function getMondayForWeekNumber(targetWeek) {
            const realCurrentMonday = getMondayOfCurrentRealWeek();
            const { currentWeek } = calculateCurrentWeek();

            let weekDiff = targetWeek - currentWeek;

            if (weekDiff > 2) weekDiff -= 4;
            if (weekDiff < -2) weekDiff += 4;

            const targetMonday = new Date(realCurrentMonday);
            targetMonday.setDate(realCurrentMonday.getDate() + (weekDiff * 7));
            return targetMonday;
        }

        function updateHeaderDates(selectedWeek) {
            const monday = getMondayForWeekNumber(parseInt(selectedWeek));

            for (let i = 0; i < 5; i++) {
                const dayDate = new Date(monday);
                dayDate.setDate(monday.getDate() + i);

                // Formato en español: "03 de noviembre de 2026"
                const options = { day: '2-digit', month: 'long', year: 'numeric' };
                const formattedDate = dayDate.toLocaleDateString('es-ES', options);

                document.getElementById(`date-${i + 1}`).textContent = formattedDate;
            }
        }

        function init() {
            const nameFilter = document.getElementById('nameFilter');
            const uniqueNames = schedules["1"].map(item => item.name).sort();

            uniqueNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                nameFilter.appendChild(option);
            });

            const { currentWeek, nextWeek } = calculateCurrentWeek();
            document.getElementById('weekSelect').value = currentWeek;

            const banner = document.getElementById('weekBanner');
            banner.innerHTML = `📌 <strong>Semana Activa:</strong> Actualmente estás viendo la <strong>Semana ${currentWeek}</strong>. El próximo lunes el sistema avanzará automáticamente a la <strong>Semana ${nextWeek}</strong>.`;

            highlightTodayColumn();
            onWeekChange();
        }

        function onWeekChange() {
            const selectedWeek = document.getElementById('weekSelect').value;
            updateHeaderDates(selectedWeek);
            updateView();
        }

        function highlightTodayColumn() {
            const jsDay = new Date().getDay();
            if (jsDay >= 1 && jsDay <= 5) {
                const th = document.getElementById(`th-${jsDay}`);
                if (th) th.classList.add('today-col');
            }
        }

        function updateView() {
            const selectedWeek = document.getElementById('weekSelect').value;
            const selectedName = document.getElementById('nameFilter').value;
            const tbody = document.getElementById('tableBody');

            tbody.innerHTML = '';

            let data = schedules[selectedWeek] || [];

            if (selectedName) {
                data = data.filter(item => item.name === selectedName);
            }

            let totals = [0, 0, 0, 0, 0];

            data.forEach(person => {
                const tr = document.createElement('tr');

                let html = `<td><strong>${person.name}</strong></td>`;

                person.days.forEach((dayType, index) => {
                    const cssClass = dayType === 'Home Office' ? 'home-office' : 'presencial';

                    const { currentWeek } = calculateCurrentWeek();
                    const isSelectedCurrent = parseInt(selectedWeek) === currentWeek;
                    const jsDay = new Date().getDay();
                    const isTodayCell = isSelectedCurrent && ((index + 1) === jsDay);

                    const cellClass = isTodayCell ? 'today-col' : '';

                    html += `<td class="${cellClass}"><span class="badge ${cssClass}">${dayType}</span></td>`;

                    if (dayType === 'Presencial') {
                        totals[index]++;
                    }
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });

            for (let i = 0; i < 5; i++) {
                document.getElementById(`tot-${i + 1}`).textContent = totals[i];
            }
        }

        window.onload = init;
    </script>
</body>

</html>
